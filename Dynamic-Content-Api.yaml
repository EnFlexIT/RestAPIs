openapi: 3.0.0
info:
  title: EnFlex.IT - Dynamic Content Api
  description: This is the Definition of the Api to dynamically fetch content for any enflex.it application
  contact:
    name: EnFlex.IT
    url: https://www.enflex.it
    email: admin@enflex.it
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.1.0

servers:
  - url: http://localhost:8080
  - url: https://www.enflex.it

# --- Api-Paths -------------------------------------------
paths:

  /menu:
    get:
      operationId: getMenus
      summary: Enables to build-up the menu structure
      description: Returns the menu structure available for the current user
      parameters:
        - name: lang
          in: query
          description: the language locale to use
          style: simple
          schema:
            type: string
      responses: 
        "200":
          $ref: '#/components/responses/MenuArray'
        "401":
            description: Unauthorized
        "503":
            description: Service unavailable

    post:
      operationId: createMenu
      summary: Create a new menu
      description: Creates a new menu and saves it in the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItem'
      responses:
        "201":
          description: Menu created
          content:
            application/json:
              schema:
                type: object
                properties:
                  menuId:
                    type: integer
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable  

  /menu/{menuId}:  
    put:
      operationId: updateMenu
      summary: Enables to update a menu
      parameters:
        - name: menuId
          in: path
          required: true
          description: The unique Id of the menu to be updated
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItem'
      responses:
        "200":
          description: The menu was updated!
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable

    delete:
      operationId: deleteMenu
      summary: Deletes the specified menu
      description: Removes the menu, its submenus and all associated menu-content assignments from the database.
      parameters:
        - name: menuId
          in: path
          required: true
          description: The unique Id of the menu to be deleted
          schema:
            type: integer
      responses:
        "200":
          description: The menu was deleted
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable

  /menu/{menuId}/permissions:
    put:
      operationId: updateMenuPermissions
      summary: Enables to set the required rights to access the specified menu
      parameters:
        - name: menuId
          in: path
          required: true
          description: The unique Id of the menu
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: The right was set
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable


  /content/{menuId}:
    get:
      operationId: getMenuContent
      summary: Returns the content for the specified Id
      description: Returns the list of content elements for the specified menu Id.
      parameters:
      - name: menuId
        in: path
        description: numeric Id of the content
        required: true
        schema:
          type: integer
      responses:
        "200":
          $ref: '#/components/responses/ContentArray'
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "503":
          description: Service unavailable      

  /contentElement:
    post:
      operationId: createContentElement
      summary: Create new content
      description: Creates a new content element
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentRequest'
      responses:
        "201":
          description: Content created
          content:
            application/json:
              schema:
                type: object
                properties:
                  elementId:
                    type: integer
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable      


  /contentElement/{elementId}:
    get:
      operationId: getContentElement
      summary: Returns the content element for the specified Id
      description: Returns the single content element corresponding to the specified Id.
      parameters:
      - name: elementId
        in: path
        description: unique Id of the content element
        required: true
        schema:
          type: integer
      responses:
        "200":
          $ref: "#/components/responses/ContentElement"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable

    put:
      operationId: updateContentElement
      summary: Enables to update content elements
      parameters:
        - name: elementId
          in: path
          required: true
          description: The unique Id of the content element to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContentElementRequest' 

      responses:
        "200":
          description: The element was updated!
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable

    delete:
      operationId: deleteContentElement
      summary: Deletes the specified content element
      description: Removes the content element from the database and thus from all associated menus.
      parameters:
        - name: elementId
          in: path
          required: true
          description: The unique Id of the content element to delete
          schema:
            type: integer
      responses:
        "200":
          description: The content element was deleted
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable


  /menu/{menuId}/contentElement/{elementId}:
    put:
      operationId: assignContentToMenu
      summary: Add the content element to the specified menu
      
      parameters:
        - name: menuId
          in: path
          required: true
          description: The unique Id of the menu
          schema:
            type: integer
        - name: elementId
          in: path
          required: true
          description: The unique Id of the content element
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/AssignContentToMenuRequest'    
               
      responses:
        "200":
          description: Content element was added to the menu
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable

    delete:
      operationId: removeAssignment
      summary: Remove a content element from a menu
      description: "Removes the assignment between the specified content element and menu. If this was the element's last menu assignment, the content element itself will be completely deleted. Subsequent items in the menu are automatically shifted to fill the gap."
      
      parameters:
        - name: menuId
          in: path
          required: true
          description: The unique Id of the menu
          schema:
            type: integer
        - name: elementId
          in: path
          required: true
          description: The unique Id of the content element
          schema:
            type: integer
      responses:
        "200":
          description: The assignment was removed
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable

  /menu/contentElement/assignment:
    put:
      operationId: updateAssignmentAndPosition
      summary: Update menu assignment and content position
      description: Reorders a content element within the same menu or moves it from a source menu to a target menu at a specified position.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContentAssignmentRequest'
      responses:
        "200":
          description: Assignment and position updated successfully
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Service unavailable

# ---------------------------------------------------------
# --- Components  -----------------------------------------
# ---------------------------------------------------------
components:

  # -------------------------------------------------------
  # --- Responses -----------------------------------------
  responses:

    MenuArray:
      description: The menus to be seen by the current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MenuList'

    ContentArray:
      description: List of content elements
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SiteContentList'

    ContentElement:
      description: A single content element
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbstractSiteContent'
      
  # -------------------------------------------------------
  # --- Schemas & type definition -------------------------
  schemas:

    AssignContentToMenuRequest:
      type: object
      properties:
        position:
          type: integer
          description: Target position of the element within the menu

    
    UpdateContentElementRequest:   
      type: object
      properties:

        content:
          $ref: '#/components/schemas/AbstractSiteContent'

    CreateContentRequest:
      type: object
      properties:
        menuId:
          type: integer

        position:
          type: integer

        content:
          $ref: '#/components/schemas/AbstractSiteContent'

      required:
        - menuId
        - position
        - content

    UpdateContentAssignmentRequest:
      type: object
      required:
        - elementId
        - sourceMenuId
        - targetMenuId
        - position
      properties:
        elementId:
          type: integer
          description: Unique Id of the content element to be moved/reordered
        sourceMenuId:
          type: integer
          description: Unique Id of the menu from which the content element is currently assigned
        targetMenuId:
          type: integer
          description: Unique Id of the menu into which the content element should be assigned
        position:
          type: integer
          description: The new one-based target position within the target menu


    MenuList:
      type: object
      properties:
        menuList:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    MenuItem:
      type: object
      properties:
        menuId:
          type: integer
        parentId:
          type: integer
        isHeadMenu:
          type: boolean
        position:
         type: integer
        caption:
          type: string
        pathId:
          type: string
        pathCaption:
          type: string
        pathPosition:
          type: string
      required:
        - menuId
        - position
        - isHeadMenu
        - caption

    SiteContentList:
      type: object
      properties:
        contentList:
          type: array
          items:
            $ref: '#/components/schemas/AbstractSiteContent'
      required:
        - "contentList"


    AbstractSiteContent:
      type: object
      x-class-extra-annotation: "@com.fasterxml.jackson.annotation.JsonIgnoreProperties(ignoreUnknown = true, value = {\"abstractSiteContentType\"})"
      required:
        - editable
        - uniqueContentId
        - updatePeriodInSeconds
        - abstractSiteContentType
      discriminator:
        propertyName: abstractSiteContentType
        mapping:
          SiteContentText: '#/components/schemas/SiteContentText'
          SiteContentImage: '#/components/schemas/SiteContentImage'
          SiteContentChart: '#/components/schemas/SiteContentChart'
          SiteContentProperties: '#/components/schemas/SiteContentProperties'
          SiteContentTableWithValues: '#/components/schemas/SiteContentTableWithValues'
          SiteContentTableWithReference: '#/components/schemas/SiteContentTableWithReference'
      properties:
        uniqueContentId:
          type: integer
        editable:
          type: boolean
        updatePeriodInSeconds:
          type: integer


    SiteContentMedia:
      allOf:
        - $ref: '#/components/schemas/AbstractSiteContent'
        - type: object
          properties:
            SiteContentMediaType:
              type: string
            mimeType:
              type: string
          required:
            - mimeType

    SiteContentText:
      allOf:
        - $ref: '#/components/schemas/SiteContentMedia'
        - type: object
          properties:
            text:
              type: string
          required:
            - text

    SiteContentImage:
      allOf:
        - $ref: '#/components/schemas/SiteContentMedia'
        - type: object
          properties:
            dataInB64:
              type: string
          required:
            - dataInB64

    # --- Schema definitions related to charts ------------
    SiteContentChart:
      allOf:
        - $ref: '#/components/schemas/AbstractSiteContent'
        - type: object
          properties:
            chart:
              $ref: '#/components/schemas/AbstractChart'    
                    
    AbstractChart:
      type: object
      properties:
        chartId:
          type: integer
        title:
          type: string
        showLegend:
          type: boolean            
        xAxisLabel:
          type: string
        yAxisLabel:
          type: string
        dataSeries:
          type: array
          items: 
            $ref: '#/components/schemas/DataSeries'
      required:
        - title
        - dataSeries       
      discriminator:
        propertyName: ChartType
        mapping:
          LineChart: '#/components/schemas/LineChart'
          TimeSeriesChart: '#/components/schemas/TimeSeriesChart'
          BarChart: '#/components/schemas/BarChart'
          PieChart: '#/components/schemas/PieChart'
          ScatterPlot: '#/components/schemas/ScatterPlot'

    LineChart:
      allOf:
        - $ref: '#/components/schemas/AbstractChart'        
        - type: object
          properties:
            secondaryYAxisLabel:
              type: string
          required:
            - xAxisLabel
            - yAxisLabel

    TimeSeriesChart:
      allOf:
        - $ref: '#/components/schemas/LineChart'
        - type: object
          properties:
            timeFormat:
              type: string
        
    BarChart:
      allOf:
        - $ref: '#/components/schemas/AbstractChart'
        - type: object
          properties:
            secondaryYAxisLabel:
              type: string
          required:
            - xAxisLabel
            - yAxisLabel
    
    PieChart:
      allOf:
        - $ref: '#/components/schemas/AbstractChart'          
        
    ScatterPlot:
      allOf:
        - $ref: '#/components/schemas/AbstractChart'
        - type: object
          properties:
            secondaryYAxisLabel:
              type: string
          required:
            - xAxisLabel
            - yAxisLabel
    
    DataSeries:
        properties: 
          label:
            type: string
          secondaryYAxis:
            type: boolean
            default: false
        discriminator:
          propertyName: seriesType
          mapping:
            DataSeriesWithValues: '#/components/schemas/DataSeriesWithValues'
            DataSeriesWithReference: '#/components/schemas/DataSeriesWithReference'
        required:
          - label


    DataSeriesWithValues:
      allOf:
        - $ref: '#/components/schemas/DataSeries'
        - type: object
          properties:
            entries:
              type: array
              items:
                $ref: '#/components/schemas/AbstractValueRow'
          required:
            - entries

    DataSeriesWithReference:
      allOf:
        - $ref: '#/components/schemas/DataSeries'
        - type: object
          properties:
            reference:
              type: string
      required:
        - reference
                          
                                  
    AbstractValueRow:
        type: object    
        properties:          
          value:
            type: array
            items:
              type: double
        discriminator:
          propertyName: xValueType
          mapping:
            Numeric: '#/components/schemas/ValueRowNumeric'
            DateTime: '#/components/schemas/ValueRowDateTime'
            Category: '#/components/schemas/ValueRowCategory'
        required:          
          - value
          - xValueType
          
    ValueRowNumeric:
      allOf:
        - $ref: '#/components/schemas/AbstractValueRow'
        - type: object
          properties:
            xValue: 
              type: number
              format: double            
          required:
            - xValue
    
    ValueRowDateTime:
      allOf:
        - $ref: '#/components/schemas/AbstractValueRow'
        - type: object
          properties:
            isoDateTime: 
              type: string      
          required:
            - isoDateTime
            
    ValueRowCategory:
      allOf:
        - $ref: '#/components/schemas/AbstractValueRow'
        - type: object
          properties:
            category: 
              type: string
          required:
            - category

    # --- Schema definitions related to properties --------
    SiteContentProperties:
      allOf:
        - $ref: '#/components/schemas/AbstractSiteContent'
        - type: object
          properties:
            propertyEntries:
              type: array
              items: 
                $ref: '#/components/schemas/PropertyEntry'
          required:
            - propertyEntries

    PropertyEntry:
      properties:
        key:
          type: string
        value:
          type: string
        valueType:
          $ref: '#/components/schemas/ValueType'
      required:
        - key
        - value
        - valueType

    ValueType:
      type: string
      enum:
      - INTEGER
      - BOOLEAN
      - STRING
      - LONG
      - DOUBLE

    # --- Schema definitions related to tables ------------
    SiteContentTable:
      allOf:
        - $ref: '#/components/schemas/AbstractSiteContent'
        - type: object
          properties:
            header:
              type: array
              items:
                type: string
            dataType:
              type: array
              items:
                $ref: '#/components/schemas/ValueType'       

    SiteContentTableWithValues:
      allOf:
        - $ref: '#/components/schemas/SiteContentTable'  
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RowVector'
                
    SiteContentTableWithReference:       
      allOf:
        - $ref: '#/components/schemas/SiteContentTable'  
        - type: object
          properties:
            reference:
              type: string
            
    RowVector:
      type: array
      items:
        type: string
